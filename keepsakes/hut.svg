<!-- An invented keepsake: two photos and a letter on Charcoal, as the
app's sealed hero draws them. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 344 286">
  <defs>
    <clipPath id="a"><rect width="236" height="160" rx="16"/></clipPath>
    <clipPath id="b"><rect width="126" height="166" rx="16"/></clipPath>
    <linearGradient id="dawn" x2="0" y2="1">
      <stop stop-color="#9CBFEB"/>
      <stop offset=".58" stop-color="#F9E4CF"/>
    </linearGradient>
    <linearGradient id="lake" x2="0" y2="1">
      <stop stop-color="#A7C6E6"/>
      <stop offset="1" stop-color="#6C93C7"/>
    </linearGradient>
    <linearGradient id="night" x2="0" y2="1">
      <stop stop-color="#0C1433"/>
      <stop offset="1" stop-color="#2C3D7C"/>
    </linearGradient>
    <linearGradient id="tent" x2="0" y2="1">
      <stop stop-color="#F29A38"/>
      <stop offset="1" stop-color="#FFD98A"/>
    </linearGradient>
  </defs>

  <!-- The hut by the lake. -->
  <g transform="translate(8 12) rotate(3 118 80)" clip-path="url(#a)">
    <rect width="236" height="160" fill="url(#dawn)"/>
    <path d="M0 90 30 52 52 70 84 30 118 72 140 56 176 90Z" fill="#8492C8"/>
    <path d="M84 30 71 47 81 44 88 53 97 46ZM30 52 21 63 31 60 38 64Z" fill="#FFFFFF" opacity=".9"/>
    <path d="M110 92 150 44 178 70 204 40 236 78V92Z" fill="#5E6CA6"/>
    <path d="M204 40 193 55 204 51 213 59ZM150 44 141 55 150 53 157 58Z" fill="#FFFFFF" opacity=".9"/>
    <rect y="88" width="236" height="40" fill="url(#lake)"/>
    <path d="M20 98h60M120 104h80M44 112h40" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity=".35"/>
    <path d="M0 124Q60 114 120 122T236 116V160H0Z" fill="#C7953F"/>
    <path d="M0 142Q70 132 130 140T236 134V160H0Z" fill="#B07F33"/>
    <g transform="translate(152 101)">
      <rect width="34" height="20" fill="#C4423B"/>
      <path d="M-4 1 17-11 38 1Z" fill="#8F2F2B"/>
      <rect x="14" y="8" width="7" height="12" fill="#3A2522"/>
      <rect x="24" y="6" width="6" height="6" fill="#F6D98A"/>
    </g>
  </g>

  <!-- The tent at night. -->
  <g transform="translate(206 108) rotate(-6 63 83)" clip-path="url(#b)">
    <rect width="126" height="166" fill="url(#night)"/>
    <g fill="#FFFFFF">
      <circle cx="18" cy="20" r="1.3"/>
      <circle cx="44" cy="38" r="1" opacity=".7"/>
      <circle cx="70" cy="16" r="1.5"/>
      <circle cx="98" cy="30" r="1" opacity=".8"/>
      <circle cx="112" cy="58" r="1.3" opacity=".7"/>
      <circle cx="30" cy="66" r="1" opacity=".6"/>
      <circle cx="84" cy="62" r="1.2" opacity=".8"/>
      <circle cx="56" cy="80" r="1" opacity=".5"/>
    </g>
    <path d="M0 118Q30 100 62 112T126 104V166H0Z" fill="#0A1029"/>
    <ellipse cx="63" cy="141" rx="46" ry="6" fill="#F29A38" opacity=".25"/>
    <path d="M30 140 63 96 96 140Z" fill="url(#tent)"/>
    <path d="M63 108 55 140H71Z" fill="#B8651F" opacity=".55"/>
  </g>

  <!-- The letter: Elegant Serif on Charcoal. -->
  <g transform="translate(12 196) rotate(-2 104 36)" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="15.5" font-weight="600" fill="#F1E8C8">
    <rect width="208" height="72" fill="#2E2A24"/>
    <text x="16" y="31" textLength="172" lengthAdjust="spacingAndGlyphs">Day three. Made the hut.</text>
    <text x="16" y="53" textLength="150" lengthAdjust="spacingAndGlyphs">Legs gone. Worth it.</text>
  </g>
</svg>
