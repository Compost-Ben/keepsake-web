<!-- An invented keepsake, drawn as the app's sealed hero draws one: photos
with 16 pt corners and a letter on its paper, on clear ground. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300">
  <defs>
    <clipPath id="a"><rect width="232" height="174" rx="16"/></clipPath>
    <clipPath id="b"><rect width="146" height="186" rx="16"/></clipPath>
    <linearGradient id="day" x2="0" y2="1">
      <stop stop-color="#7DC1EC"/>
      <stop offset=".55" stop-color="#D8EEF2"/>
    </linearGradient>
    <linearGradient id="sea" x2="0" y2="1">
      <stop stop-color="#2B8DB4"/>
      <stop offset="1" stop-color="#6FC8CB"/>
    </linearGradient>
    <linearGradient id="sand" x2="0" y2="1">
      <stop stop-color="#F4E4C0"/>
      <stop offset="1" stop-color="#E5C78D"/>
    </linearGradient>
  </defs>

  <!-- The beach. -->
  <g transform="translate(8 10) rotate(-4 116 87)" clip-path="url(#a)">
    <rect width="232" height="174" fill="url(#day)"/>
    <g fill="#FFFFFF" opacity=".85">
      <ellipse cx="50" cy="36" rx="26" ry="7"/>
      <ellipse cx="66" cy="31" rx="16" ry="7"/>
      <ellipse cx="170" cy="24" rx="20" ry="5"/>
    </g>
    <path d="M232 58C206 58 186 70 164 80S132 92 118 92H232Z" fill="#5C8E84"/>
    <path d="M232 70C214 72 200 80 182 86S160 92 150 92H232Z" fill="#497A70"/>
    <rect y="90" width="232" height="40" fill="url(#sea)"/>
    <path d="M0 126C40 120 70 130 116 126S190 120 232 126V174H0Z" fill="url(#sand)"/>
    <path d="M0 126C40 120 70 130 116 126S190 120 232 126" fill="none" stroke="#FFFFFF" stroke-width="3" opacity=".8"/>
    <ellipse cx="94" cy="160" rx="30" ry="4.5" fill="#B9965C" opacity=".5"/>
    <g transform="rotate(-10 78 158)">
      <path d="M78 96V158" stroke="#6B4E33" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M42 122A36 30 0 0 1 114 122Z" fill="#E4573F"/>
      <path d="M78 92 54 122H66ZM78 92 90 122H102Z" fill="#FFFFFF"/>
    </g>
    <g transform="rotate(-5 134 156)">
      <rect x="114" y="150" width="40" height="13" rx="2" fill="#2E8C9E"/>
      <rect x="114" y="155" width="40" height="3" fill="#FFFFFF"/>
    </g>
    <path d="M160 146Q192 132 226 142Q194 158 160 146Z" fill="#F2A33C"/>
    <ellipse cx="193" cy="145" rx="9" ry="3.5" fill="#7A4A1E" transform="rotate(-6 193 145)"/>
  </g>

  <!-- The bach. -->
  <g transform="translate(204 66) rotate(6 73 93)" clip-path="url(#b)">
    <rect width="146" height="186" fill="url(#day)"/>
    <path d="M0 92Q36 66 82 80T146 70V186H0Z" fill="#7DB487"/>
    <path d="M22 136Q25 112 18 98" fill="none" stroke="#4A3528" stroke-width="5" stroke-linecap="round"/>
    <ellipse cx="18" cy="86" rx="30" ry="22" fill="#2F6B4F"/>
    <g fill="#D9304F">
      <circle cx="4" cy="78" r="3"/>
      <circle cx="16" cy="72" r="3"/>
      <circle cx="30" cy="80" r="3"/>
      <circle cx="12" cy="90" r="3"/>
      <circle cx="26" cy="96" r="3"/>
      <circle cx="38" cy="90" r="2.5"/>
    </g>
    <path d="M0 132Q50 122 96 130T146 126V186H0Z" fill="#579E66"/>
    <path d="M30 94 78 66 126 94Z" fill="#B9483A"/>
    <rect x="36" y="92" width="84" height="48" fill="#F4ECDD"/>
    <path d="M36 100h84M36 108h84M36 116h84M36 124h84M36 132h84" stroke="#DDD0B8"/>
    <rect x="70" y="106" width="18" height="34" fill="#F2C14E"/>
    <rect x="44" y="104" width="18" height="15" fill="#3A5873" stroke="#FFFFFF" stroke-width="2"/>
    <rect x="96" y="104" width="18" height="15" fill="#3A5873" stroke="#FFFFFF" stroke-width="2"/>
  </g>

  <!-- The letter: Elegant Serif on Aged Cream. -->
  <g transform="translate(14 214) rotate(-3 113 36)" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="15.5" font-weight="600" fill="#221C12">
    <rect width="226" height="72" fill="#F3E0B5"/>
    <text x="16" y="31" textLength="186" lengthAdjust="spacingAndGlyphs">Same spot next summer?</text>
    <text x="16" y="53" textLength="150" lengthAdjust="spacingAndGlyphs">I’ll bring the kayak.</text>
  </g>
</svg>
