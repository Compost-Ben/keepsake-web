<!doctype html>
<!-- An invite's link, /invite/#<code>, where Keepsake did not open. The
code rides in the fragment, which no server sees, so every invite is this
one page: status 200 and one preview card. Where Keepsake cannot be, the
invite opens in the browser, at /app/; an iPhone or iPad is offered the app
first, then the browser, and lines for one that has only just got it. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0E1440">
<title>Keepsake</title>
<meta property="og:title" content="Keepsake">
<meta property="og:description" content="Treasured by you &amp; your people!">
<meta property="og:image" content="https://keepsakeapp.nz/icon.png">
<link rel="stylesheet" href="../palette.css">
<script src="../store.js"></script>
<!-- Apple's banner, written as the head is read; Safari ignores one added
later. Its Open hands Keepsake the invite's link, as the app makes it. -->
<script>
  var found = location.hash.match(/^#([0-9A-Z]{10})$/i);
  var browser = '/app/invite/' + (found ? '#' + found[1].toUpperCase() : '');
  // An iPhone or iPad; an iPad's Safari says Mac, but has touch.
  var apple = /iPhone|iPad/.test(navigator.userAgent) || (/Mac/.test(navigator.userAgent) && navigator.maxTouchPoints > 1);
  if (!apple) location.replace(browser);
  if (appStore) document.write('<meta name="apple-itunes-app" content="app-id=6759589474, app-argument=' +
    'https://keepsakeapp.nz/invite/' + (found ? '#' + found[1].toUpperCase() : '') + '">');
</script>
<style>
  html { background: var(--solid); }
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 0 16px;
    background: url(../sky.svg) 0 0 / 100% 100%;
    font: 600 17px -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  }
  a {
    box-sizing: border-box;
    width: 100%;
    max-width: 320px;
    padding: 15px 16px;
    border-radius: 999px;
    background: var(--fill);
    color: var(--on-fill);
    text-align: center;
    text-decoration: none;
  }
  .store, #here {
    border: 1px solid var(--text);
    background: none;
    color: var(--text);
  }
  p {
    margin: 0;
    max-width: 320px;
    color: var(--text);
    font-weight: 400;
    font-size: 15px;
    text-align: center;
  }
</style>
</head>
<body>
<a id="open" href="keepsake://">Open in Keepsake</a>
<a id="here" href="/app/">Open it in this browser</a>
<p>No Keepsake on this device?<br>It is coming to the App Store.</p>
<p>Just installed Keepsake? Tap the link again.</p>
<script>
  if (found) document.getElementById('open').href = 'keepsake://invite/' + found[1].toUpperCase();
  document.getElementById('here').href = browser;
  if (appStore) document.querySelector('p').outerHTML =
    '<p>No Keepsake on this device?</p><a class="store" href="' + appStore + '">Get Keepsake on the App Store</a>';
</script>
</body>
</html>
