<!doctype html>
<!-- An invite's link, /invite/#<code>, where Keepsake did not open. The
code rides in the fragment, which no server sees, so every invite is this
one page: status 200 and one preview card. Where Keepsake cannot be, the
invite opens in the browser, at /app/; an iPhone or iPad here most likely
has no Keepsake (with it, the link opens the app), so it leads with the
browser, then the App Store, then the app, and a line for one that has
only just got it. No link reaches an app through the App Store, so the
App Store's button copies the invite on the way, and Keepsake's welcome
asks for it pasted while something is copied. An
invite email's link carries its one-tap pass after the code (?pass=),
handed on wherever the invite goes. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0E1440">
<title>Keepsake</title>
<meta property="og:title" content="Keepsake">
<meta property="og:description" content="Treasured by you &amp; your people!">
<meta property="og:image" content="https://keepsakeapp.nz/icon.png">
<link rel="stylesheet" href="../palette.css">
<script src="../store.js"></script>
<!-- Apple's banner, written as the head is read; Safari ignores one added
later. Its Open hands Keepsake the invite's link, as the app makes it. -->
<script>
  var found = location.hash.match(/^#([0-9A-Z]{10})(\?pass=[\w-]{22})?$/i);
  var invite = found ? found[1].toUpperCase() + (found[2] || '') : '';
  var browser = '/app/invite/' + (found ? '#' + invite : '');
  // An iPhone or iPad; an iPad's Safari says Mac, but has touch.
  var apple = /iPhone|iPad/.test(navigator.userAgent) || (/Mac/.test(navigator.userAgent) && navigator.maxTouchPoints > 1);
  if (!apple) location.replace(browser);
  if (appStore) document.write('<meta name="apple-itunes-app" content="app-id=6759589474, app-argument=' +
    'https://keepsakeapp.nz/invite/' + (found ? '#' + invite : '') + '">');
</script>
<style>
  html { background: var(--solid); }
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 0 16px;
    background: url(../sky.svg) 0 0 / 100% 100%;
    font: 600 17px -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  }
  a {
    box-sizing: border-box;
    width: 100%;
    max-width: 320px;
    padding: 15px 16px;
    border-radius: 999px;
    background: var(--fill);
    color: var(--on-fill);
    text-align: center;
    text-decoration: none;
  }
  .store, #open {
    border: 1px solid var(--text);
    background: none;
    color: var(--text);
  }
  p {
    margin: 0;
    max-width: 320px;
    color: var(--text);
    font-weight: 400;
    font-size: 15px;
    text-align: center;
  }
</style>
</head>
<body>
<a id="here" href="/app/">Open it here</a>
<p>No Keepsake on this device?<br>It is coming to the App Store.</p>
<a id="open" href="keepsake://">Open in Keepsake</a>
<p>Just installed Keepsake? Tap Open in Keepsake.</p>
<script>
  if (found) document.getElementById('open').href = 'keepsake://invite/' + invite;
  document.getElementById('here').href = browser;
  if (appStore) document.querySelector('p').outerHTML =
    '<p>No Keepsake on this device?</p><a class="store" href="' + appStore + '">Get Keepsake on the App Store</a>' +
    (found ? '<p>It copies your invite, to paste when Keepsake opens.</p>' : '');
  // The copy waits for the tap, as Safari asks, and the App Store opens
  // whether or not it took.
  var store = document.querySelector('.store');
  if (store && found) store.addEventListener('click', function (event) {
    event.preventDefault();
    var go = function () { location.href = store.href; };
    var copying = navigator.clipboard && navigator.clipboard.writeText('https://keepsakeapp.nz/invite/#' + invite);
    if (copying) copying.then(go, go); else go();
  });
</script>
</body>
</html>
