<!doctype html>
<!-- Save my keepsakes without the app. It talks only to Keepsake's
servers, through save.js. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Save my keepsakes</title>
<link rel="stylesheet" href="../palette.css">
<style>
  * { box-sizing: border-box; margin: 0; }
  [hidden] { display: none !important; }
  html { background: var(--solid); }
  /* The app's Dusk sky, held still. */
  body::before {
    content: '';
    position: fixed;
    inset: 0 0 auto;
    height: 100vh;
    z-index: -1;
    background: url(../sky.svg) 0 0 / 100% 100%;
  }
  body {
    max-width: 560px;
    margin: 0 auto;
    padding: 32px 16px;
    color: var(--text);
    font: 17px/1.45 -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  a { color: inherit; }
  h1 { font-size: 34px; line-height: 1.2; margin: 16px 0 12px; }
  form, section {
    margin-top: 20px;
    padding: 20px;
    border: 1px solid var(--edge);
    border-radius: 16px;
    background: var(--panel);
  }
  input {
    display: block;
    width: 100%;
    margin: 8px 0 16px;
    padding: 12px 14px;
    border: 1px solid var(--edge);
    border-radius: 12px;
    background: none;
    color: inherit;
    font: inherit;
  }
  button {
    padding: 12px 22px;
    border: 0;
    border-radius: 999px;
    background: var(--fill);
    color: var(--on-fill);
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  .plain { padding: 12px 8px; background: none; color: inherit; font-weight: 400; }
  ul { list-style: none; padding: 0; margin-bottom: 8px; }
  li { display: flex; align-items: center; gap: 12px; padding: 12px 0; }
  li + li { border-top: 1px solid var(--edge); }
  li span { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  li small { display: block; font-size: 15px; }
  li button { padding: 8px 18px; font-size: 15px; }
  #said { margin-top: 16px; }
</style>
</head>
<body>
<a href="/">Keepsake</a>
<h1>Save my keepsakes</h1>
<p>Every keepsake you hold, made or received, saved whole, each as a zip of its own. Best on a computer.</p>
<form id="ask">
  <label for="email">Enter your email to receive a 6-digit sign-in code.</label>
  <input id="email" type="email" autocomplete="email" autocapitalize="off" spellcheck="false" required>
  <button>Send Code</button>
</form>
<form id="check" hidden>
  <label for="code" id="sent"></label>
  <input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required>
  <button>Verify &amp; Sign In</button>
  <button type="button" class="plain" id="back">Back</button>
</form>
<section id="held" hidden>
  <ul id="list"></ul>
  <button type="button" class="plain" id="out">Sign out</button>
</section>
<p id="said" role="status"></p>
<script type="module" src="save.js"></script>
</body>
</html>
