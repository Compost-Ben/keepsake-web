<!doctype html>
<!-- What GitHub Pages serves for a path the site has no file for. Under
/app/ the path is a page of Keepsake in a browser, so it goes to the app
as ?from=, its fragment with it; the app puts it back (linking.ts). -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Keepsake</title>
<script>
  var page = location.pathname.match(/^\/app(\/.*)$/);
  if (page) {
    document.documentElement.style.visibility = 'hidden';
    location.replace('/app/?from=' + encodeURIComponent(page[1] + location.search) + location.hash);
  }
</script>
<link rel="stylesheet" href="/palette.css">
<style>
  html { background: var(--solid); }
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 0 16px;
    background: url(/sky.svg) 0 0 / 100% 100%;
    font: 400 15px -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    color: var(--text);
  }
  a { color: var(--text); font-weight: 600; }
</style>
</head>
<body>
<p>There is no page here.</p>
<a href="/">Keepsake</a>
</body>
</html>
