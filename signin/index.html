<!doctype html>
<!-- The code email's link, /signin/#<token>, where Keepsake did not open.
The token rides in the fragment, which no server sees; this page sends it
nowhere and keeps none of it. Its first button hands it to the app, so shows
only where Keepsake can be; the next signs this browser in at /app/. Neither
goes by itself: the code may be for a phone, and a token signs in once. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0E1440">
<meta name="robots" content="noindex">
<title>Keepsake</title>
<link rel="stylesheet" href="../palette.css">
<script src="../store.js"></script>
<style>
  html { background: var(--solid); }
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    /* On the water: 30px under the horizon, 372/844 of the sky's height. */
    box-sizing: border-box;
    padding: calc(44.076vh + 30px) 16px 30px;
    padding-top: calc(44.076dvh + 30px);
    background: url(../sky.svg) 0 0 / 100% 100%;
    font: 600 17px -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  }
  a {
    box-sizing: border-box;
    width: 100%;
    max-width: 320px;
    padding: 15px 16px;
    border-radius: 999px;
    background: var(--fill);
    color: var(--on-fill);
    text-align: center;
    text-decoration: none;
  }
  .store, #here {
    border: 1px solid var(--text);
    background: none;
    color: var(--text);
  }
  .store {
    margin-top: 16px;
  }
  p {
    margin: 0;
    max-width: 320px;
    color: var(--text);
    font-weight: 400;
    font-size: 15px;
    text-align: center;
  }
</style>
</head>
<body>
<a id="open" href="keepsake://" hidden>Open Keepsake</a>
<a id="here" href="/app/">Sign in on this browser</a>
<p>On another device? Open Keepsake on your phone and type in the code from the email.</p>
<a class="store">Get Keepsake on the App Store</a>
<script>
  var button = document.getElementById('open');
  var found = location.hash.match(/^#([\w-]+)$/);
  if (found) button.href = 'keepsake://signin/#' + found[1];
  document.getElementById('here').href = '/app/signin/' + (found ? '#' + found[1] : '');
  // An iPhone or iPad; an iPad's Safari says Mac, but has touch.
  var ua = navigator.userAgent;
  button.hidden = !(/iPhone|iPad/.test(ua) || (/Mac/.test(ua) && navigator.maxTouchPoints > 1));
  if (appStore) document.querySelector('.store').href = appStore;
</script>
</body>
</html>
